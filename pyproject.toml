[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydsh"
dynamic = ["version"]
description = "test"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio", "pytest-cov"]

[project.scripts]
pydsh = "pydsh.infrastructure.boot.cli:main"

[project.entry-points."pydsh.plugins"]
"pydsh.config" = "pydsh.infrastructure.config.providers.config"
"pydsh.root" = "pydsh.packages.services.workspace.providers.root"
"pydsh.sessions" = "pydsh.packages.services.session.providers.sessions"
"pydsh.prompt" = "pydsh.packages.services.prompt.providers.prompt"
"pydsh.tools" = "pydsh.packages.services.tool_runtime.providers.tools"
"pydsh.llm-openai" = "pydsh.packages.services.llm.providers.openai"
"pydsh.llm-fake" = "pydsh.packages.services.llm.providers.fake"
"pydsh.subprocess" = "pydsh.packages.services.subprocess.providers.local"
"pydsh.sandbox" = "pydsh.packages.services.sandbox.providers.bwrap"
"pydsh.shell-local" = "pydsh.packages.services.shell.providers.local"
"pydsh.shell-sandbox" = "pydsh.packages.services.shell.providers.sandbox"
"pydsh.fs-local" = "pydsh.packages.services.fs.providers.local"
"pydsh.tool-bash" = "pydsh.packages.tools.bash"
"pydsh.tool-read" = "pydsh.packages.tools.read_file"
"pydsh.tool-write" = "pydsh.packages.tools.write_file"
"pydsh.tool-edit" = "pydsh.packages.tools.edit_file"
"pydsh.tool-glob" = "pydsh.packages.tools.glob"
"pydsh.tool-grep" = "pydsh.packages.tools.grep"
"pydsh.tool-todo" = "pydsh.packages.tools.todo_write"
"pydsh.tool-ask-user" = "pydsh.packages.tools.ask_user_question"
"pydsh.skills" = "pydsh.packages.services.skills.providers.skills"
"pydsh.subagents" = "pydsh.packages.services.subagent.providers.subagents"
"pydsh.agents" = "pydsh.packages.services.agents.providers.agents"
"pydsh.projections" = "pydsh.packages.services.session_projection.providers.projections"
"pydsh.settings" = "pydsh.packages.services.settings.providers.file"
"pydsh.agents-md" = "pydsh.packages.services.prompt.providers.agents_md"
"pydsh.loop" = "pydsh.packages.services.loop.providers.loop"
"pydsh.compaction" = "pydsh.packages.services.compaction.providers.compaction"
"pydsh.token-meter" = "pydsh.packages.services.token_meter.providers.token_meter"
"pydsh.approval" = "pydsh.packages.services.approval.providers.approval"
"pydsh.web" = "pydsh.packages.services.web.providers.runtime"
"pydsh.web-fetch" = "pydsh.packages.services.web.providers.fetch_http"
"pydsh.web-search-ddg" = "pydsh.packages.services.web.providers.search_ddg"
"pydsh.tool-web" = "pydsh.packages.tools.web"
"pydsh.lsp" = "pydsh.packages.services.lsp.providers.runtime"
"pydsh.tool-lsp" = "pydsh.packages.tools.lsp"
"pydsh.trace-render" = "pydsh.packages.services.session.reporting.trace_render"
"pydsh.persistence-jsonl" = "pydsh.packages.services.persistence.providers.jsonl"
"pydsh.persistence-sqlite" = "pydsh.packages.services.persistence.providers.sqlite"
"pydsh.app-tui" = "pydsh.infrastructure.tui.app_pi_tui"
"pydsh.acp" = "pydsh.packages.services.acp.providers.acp"
"pydsh.app-acp" = "pydsh.packages.services.acp.app"

[tool.setuptools.dynamic]
version = {attr = "pydsh.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pydsh*"]

[tool.pytest.ini_options]
pythonpath = ["pydsh"]
testpaths = ["tests"]
asyncio_mode = "auto"
