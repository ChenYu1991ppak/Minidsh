[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh"
dynamic = ["version"]
description = "最小化 DeepSeek Harness（dsh）：cordis 内核 + agent-loop + tools/skills/subagent/compaction，全程可观测"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio", "pytest-cov"]

[project.scripts]
minidsh = "minidsh.applications.workspace.cli:main"

# 内置 base 插件 + 未来第三方插件共用的发现组：条目名 = 插件名，值 = 可 import 模块
[project.entry-points."minidsh.plugins"]
"minidsh.config" = "minidsh.infrastructure.config.providers.config"
"minidsh.root" = "minidsh.applications.workspace.providers.root"
"minidsh.sessions" = "minidsh.capabilities.session.providers.sessions"
"minidsh.prompt" = "minidsh.capabilities.prompt.providers.prompt"
"minidsh.tools" = "minidsh.capabilities.tools.providers.tools"
"minidsh.llm-openai" = "minidsh.capabilities.llm.providers.openai"
"minidsh.shell-local" = "minidsh.capabilities.shell.providers.local"
"minidsh.fs-local" = "minidsh.capabilities.fs.providers.local"
"minidsh.tool-bash" = "minidsh.capabilities.shell.tools.bash"
"minidsh.tool-read" = "minidsh.capabilities.fs.tools.read_file"
"minidsh.skills" = "minidsh.capabilities.skills.providers.skills"
"minidsh.subagents" = "minidsh.capabilities.subagent.providers.subagents"
"minidsh.agents-md" = "minidsh.capabilities.prompt.providers.agents_md"
"minidsh.loop" = "minidsh.applications.loop.providers.loop"
"minidsh.compaction" = "minidsh.capabilities.compaction.providers.compaction"
"minidsh.trace-render" = "minidsh.applications.trace.providers.trace_render"
"minidsh.persistence" = "minidsh.capabilities.session.providers.persistence"

[tool.setuptools.dynamic]
version = {attr = "minidsh.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"