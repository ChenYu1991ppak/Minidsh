"minidsh.infrastructure.config.providers" = "src/infrastructure/config/providers"
"minidsh.infrastructure.packaging" = "src/infrastructure/packaging"
"minidsh.infrastructure.profile" = "src/infrastructure/profile"
"minidsh.infrastructure.tui" = "src/infrastructure/tui"
"minidsh.packages" = "src/packages"
"minidsh.packages.core" = "src/packages/core"
"minidsh.packages.core.scope" = "src/packages/core/scope"
"minidsh.packages.services" = "src/packages/services"
"minidsh.packages.services.acp" = "src/packages/services/acp"
