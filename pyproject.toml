"minidsh.packages.services.token_meter" = "src/packages/services/token_meter"
"minidsh.packages.services.token_meter.providers" = "src/packages/services/token_meter/providers"
"minidsh.packages.services.tool_runtime" = "src/packages/services/tool_runtime"
"minidsh.packages.services.tool_runtime.providers" = "src/packages/services/tool_runtime/providers"
"minidsh.packages.services.web" = "src/packages/services/web"
"minidsh.packages.services.web.providers" = "src/packages/services/web/providers"
"minidsh.packages.services.workspace" = "src/packages/services/workspace"
"minidsh.packages.services.workspace.providers" = "src/packages/services/workspace/providers"
"minidsh.packages.tools" = "src/packages/tools"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
