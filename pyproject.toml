"minidsh.packages.services.lsp" = "src/packages/services/lsp"
"minidsh.packages.services.lsp.providers" = "src/packages/services/lsp/providers"
"minidsh.packages.services.persistence" = "src/packages/services/persistence"
"minidsh.packages.services.persistence.providers" = "src/packages/services/persistence/providers"
"minidsh.packages.services.prompt" = "src/packages/services/prompt"
"minidsh.packages.services.prompt.providers" = "src/packages/services/prompt/providers"
"minidsh.packages.services.rpc" = "src/packages/services/rpc"
"minidsh.packages.services.sandbox" = "src/packages/services/sandbox"
"minidsh.packages.services.sandbox.providers" = "src/packages/services/sandbox/providers"
"minidsh.packages.services.session" = "src/packages/services/session"
"minidsh.packages.services.session.providers" = "src/packages/services/session/providers"
"minidsh.packages.services.session.reporting" = "src/packages/services/session/reporting"
"minidsh.packages.services.session_projection" = "src/packages/services/session_projection"
"minidsh.packages.services.session_projection.providers" = "src/packages/services/session_projection/providers"
"minidsh.packages.services.settings" = "src/packages/services/settings"
