[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh"
dynamic = ["version"]
description = "最小化 DeepSeek Harness（dsh）：cordis 内核 + agent-loop + tools/skills/subagent/compaction，全程可观测"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "pyyaml>=6.0", "textual>=0.80", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio", "pytest-cov"]

[project.scripts]
minidsh = "minidsh.infrastructure.boot.cli:main"

# 内置 base 插件 + 未来第三方插件共用的发现组：条目名 = 插件名，值 = 可 import 模块
[project.entry-points."minidsh.plugins"]
"minidsh.config" = "minidsh.infrastructure.config.providers.config"
"minidsh.root" = "minidsh.packages.services.workspace.providers.root"
"minidsh.sessions" = "minidsh.packages.services.session.providers.sessions"
"minidsh.prompt" = "minidsh.packages.services.prompt.providers.prompt"
"minidsh.tools" = "minidsh.packages.services.tool_runtime.providers.tools"
"minidsh.llm-openai" = "minidsh.packages.services.llm.providers.openai"
"minidsh.llm-fake" = "minidsh.packages.services.llm.providers.fake"
"minidsh.subprocess" = "minidsh.packages.services.subprocess.providers.local"
"minidsh.sandbox" = "minidsh.packages.services.sandbox.providers.bwrap"
"minidsh.shell-local" = "minidsh.packages.services.shell.providers.local"
"minidsh.shell-sandbox" = "minidsh.packages.services.shell.providers.sandbox"
"minidsh.fs-local" = "minidsh.packages.services.fs.providers.local"
"minidsh.tool-bash" = "minidsh.packages.tools.bash"
"minidsh.tool-read" = "minidsh.packages.tools.read_file"
"minidsh.skills" = "minidsh.packages.services.skills.providers.skills"
"minidsh.subagents" = "minidsh.packages.services.subagent.providers.subagents"
"minidsh.agents" = "minidsh.packages.services.agents.providers.agents"
"minidsh.projections" = "minidsh.packages.services.session_projection.providers.projections"
"minidsh.settings" = "minidsh.packages.services.settings.providers.file"
"minidsh.agents-md" = "minidsh.packages.services.prompt.providers.agents_md"
"minidsh.loop" = "minidsh.packages.services.loop.providers.loop"
"minidsh.compaction" = "minidsh.packages.services.compaction.providers.compaction"
"minidsh.token-meter" = "minidsh.packages.services.token_meter.providers.token_meter"
"minidsh.approval" = "minidsh.packages.services.approval.providers.approval"
"minidsh.web" = "minidsh.packages.services.web.providers.runtime"
"minidsh.web-fetch" = "minidsh.packages.services.web.providers.fetch_http"
"minidsh.tool-web" = "minidsh.packages.tools.web"
"minidsh.lsp" = "minidsh.packages.services.lsp.providers.runtime"
"minidsh.tool-lsp" = "minidsh.packages.tools.lsp"
"minidsh.trace-render" = "minidsh.packages.services.session.reporting.trace_render"
"minidsh.persistence-jsonl" = "minidsh.packages.services.persistence.providers.jsonl"
"minidsh.persistence-sqlite" = "minidsh.packages.services.persistence.providers.sqlite"
"minidsh.app-tui-textual" = "minidsh.infrastructure.tui.app_plugin"
"minidsh.acp" = "minidsh.packages.services.acp.providers.acp"
"minidsh.app-acp" = "minidsh.packages.services.acp.app"

[tool.setuptools.dynamic]
version = {attr = "minidsh.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
